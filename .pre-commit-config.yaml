repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.0
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: muscal-governance-validator
        name: MUSCAL Governance Validator
        entry: python guards/pre_commit_hook.py --staged-files
        language: system
        stages: [commit]
        pass_filenames: false
