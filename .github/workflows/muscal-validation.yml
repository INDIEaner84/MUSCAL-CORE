name: MUSCAL Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reconciliation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-cov
      - name: Run reconciliation unit tests
        run: |
          pytest tests/reconciliation/ -v --tb=short
      - name: Run runner integration tests
        run: |
          pytest tests/reconciliation/test_runner.py -v --tb=short
      - name: Run pipeline E2E tests
        run: |
          pytest tests/reconciliation/test_pipeline_e2e.py -v --tb=short

  reconciliation-pipeline:
    runs-on: ubuntu-latest
    needs: reconciliation-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run reconciliation engine
        run: python3 scripts/reconcile.py
      - name: Verify report exists
        run: |
          test -f docs/audit/reconciliation_report.md
          echo "Report generated successfully"
      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-report
          path: docs/audit/reconciliation_report.md

  performance-benchmarks:
    runs-on: ubuntu-latest
    needs: reconciliation-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run performance benchmarks
        run: |
          pytest tests/benchmarks/ -v --tb=short

  quality-gates:
    runs-on: ubuntu-latest
    needs: [reconciliation-tests, reconciliation-pipeline, performance-benchmarks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Verify all scanners import
        run: |
          python3 -c "
          from reconciliation.scan import (
              BrokenLinkScanner,
              AdrValidatorScanner,
              ImportValidatorScanner,
              DriftDetectorScanner,
              RfcValidatorScanner,
          )
          print('All 5 scanners import successfully')
          "
      - name: Verify runner initialization
        run: |
          python3 -c "
          from reconciliation.runner import ReconciliationRunner
          runner = ReconciliationRunner('.')
          runner.register_defaults()
          assert len(runner._scanners) == 5
          print('Runner initialized with 5 scanners')
          "
      - name: Verify reconciliation pipeline
        run: |
          python3 -c "
          from reconciliation.runner import ReconciliationRunner
          runner = ReconciliationRunner('.')
          runner.register_defaults()
          results = runner.run_all()
          assert len(results) == 5
          total = sum(r.count for r in results)
          print(f'Pipeline complete: {total} findings')
          "
      - name: Baseline comparison
        run: python3 scripts/compare_baseline.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run linter
        run: ruff check reconciliation/
      - name: Run type checker
        run: mypy reconciliation/ --ignore-missing-imports || true
