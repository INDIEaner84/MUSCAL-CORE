[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["archive*", "tests*", "docs*", "frontend*", "muscal-mvp*", "white-paper*", ".opencode*", "baseline*", "specs*", "reports*", "storage*"]

[project]
name = "muscal-core"
version = "0.8.0"
description = "MUSCAL CORE — Multi-Step Cognitive Architecture Language"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-limiter>=3.8.0",
    "flasgger>=0.9.7",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "slowapi>=0.1.9",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pip-audit>=2.7.0",
    "pytest>=9.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
rag = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
browser = [
    "playwright>=1.40.0",
]
desktop = [
    "pyautogui>=0.9.54",
]
dashboard = [
    "streamlit>=1.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["api", "compiler", "container", "contract", "execution", "graph", "integration", "kernel", "memory", "reference", ".git", ".pytest_cache"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest-asyncio]
mode = "auto"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "archive/*", ".github/*"]
